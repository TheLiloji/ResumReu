services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: resumreu:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DATA_DIR: /app/data
      CHROMA_PERSIST_DIR: /app/data/vector_store
      DATABASE_URL: sqlite:////app/data/resumreu.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/cache/huggingface
      - torch_cache:/cache/torch
    depends_on:
      redis:
        condition: service_healthy
    command: ["/usr/local/bin/entrypoint-api.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    image: resumreu:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DATA_DIR: /app/data
      CHROMA_PERSIST_DIR: /app/data/vector_store
      DATABASE_URL: sqlite:////app/data/resumreu.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - hf_cache:/cache/huggingface
      - torch_cache:/cache/torch
    depends_on:
      redis:
        condition: service_healthy
    command: ["/usr/local/bin/entrypoint-worker.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data:
  hf_cache:
  torch_cache:
