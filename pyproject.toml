[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resumreu"
version = "0.1.0"
description = "Local meeting summarization and Q&A using Whisper, pyannote and Gemma 4."
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ResumReu" }]

dependencies = [
  # Core
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "structlog>=24.1",

  # Audio / speech
  "faster-whisper>=1.0.3",
  "pyannote.audio>=3.3.1",
  "torchaudio>=2.3",
  "soundfile>=0.12",
  "pydub>=0.25",

  # LLM stack (HuggingFace)
  "torch>=2.3",
  "transformers>=4.45",
  "accelerate>=0.34",
  "bitsandbytes>=0.43",
  "sentencepiece>=0.2",
  "protobuf>=4.25",

  # RAG
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "langchain>=0.3",
  "langchain-community>=0.3",

  # Documents
  "python-docx>=1.1",
  "pypdf>=4.3",

  # API + workers
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5.0",

  # Persistence
  "sqlalchemy>=2.0",
  "alembic>=1.13",

  # UI
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
